services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-mastergateway}
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/1-init.sql:ro
      - ./db/data.sql:/docker-entrypoint-initdb.d/2-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-mastergateway}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_HOSTNAME: db
      DB_NAME: ${DB_NAME:-mastergateway}
      DB_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-jwtsecret}
      JWT_EXPIRE_IN_MINUTES: ${JWT_EXPIRE_IN_MINUTES:-5}
      TEMP_TOKEN_EXPIRE_IN_MINUTES: ${TEMP_TOKEN_EXPIRE_IN_MINUTES:-2}
      REFRESH_TOKEN_EXPIRE_IN_DAYS: ${REFRESH_TOKEN_EXPIRE_IN_DAYS:-7}
      INTERNAL_SERVICES_SECRET: ${INTERNAL_SERVICES_SECRET:-internalservicessecret}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  db_data:
